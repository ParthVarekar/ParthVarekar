<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24">
  <!-- neon pulse divider -->
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff14" stop-opacity="1"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="800" y2="12" stroke="#163024" stroke-width="2"/>
  <rect x="-200" y="10" width="200" height="4" rx="2" fill="url(#pulse)" filter="url(#g)">
    <animate attributeName="x" from="-200" to="800" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <g fill="#39ff14" filter="url(#g)">
    <circle cx="4" cy="12" r="3"/>
    <circle cx="796" cy="12" r="3"/>
  </g>
</svg>
