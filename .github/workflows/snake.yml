name: snake

# draws an orange snake (light + dark) eating the contribution graph and publishes it to the `output` branch
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5a1f&color_dots=#161b22,#4a1d0c,#8a3413,#d0481a,#ff5a1f
            dist/snake-light.svg?color_snake=#e4480f&color_dots=#ebedf0,#ffd3c0,#ffa47d,#f36d38,#e4480f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 refresh snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
