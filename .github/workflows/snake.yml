name: snake

# draws a neon snake eating the contribution graph and publishes it to the `output` branch
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#39ff14&color_dots=#161b22,#0e4429,#006d32,#26a641,#39ff14

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 refresh snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
